<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería - PreEntrega 10</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>
   <main class="wrapper">
        <h1 class="title-princ">Bienvenido a la Ferretería</h1>
        <p>Encuentra todo lo que necesitas para tus proyectos de construcción y reparación.</p>
       

        <section class="agregar-section">
            <input type="text" id="input-nombre" placeholder="Nombre del producto...">
            

            <div class="input-precio-contenedor">
                <span class="moneda">$</span>
                <input type="number" id="input-precio" placeholder="Precio..." min="0" step="0.01">

            </div>

            <select id="input-categoria">
                <option value="">Seleccionar categoría...</option>
                <option value="Herramientas">Herramientas</option>
                <option value="Construcción y albañilería">Construcción y albañilería</option>
                <option value="Mantenimiento">Mantenimiento</option>
                <option value="Pinturería">Pinturería</option>
            </select>
            <button type="button" id="btn-agregar">Agregar</button>
        </section>

        <p id="feedback"></p>

        <section class="search-section">
            <input type="text" id="input-buscar" placeholder="Buscar productos...">

        </section>

        <h2 class="title-sec">Catalogo disponible</h2>

        <div id="cargando" class="estado-carga" hidden>
            <div class="spinner"></div>
            <p>Cargando productos...</p>
        </div>

        <div id="contenedor-items" class="contenedor-items">
            
        </div>
   </main>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
<script src="./js/main.js"></script>

</body>
</html>
